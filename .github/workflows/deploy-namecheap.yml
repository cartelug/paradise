name: Deploy Pardus to Namecheap
on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/deploy-namecheap.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pardus-namecheap-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install dependencies
        working-directory: website
        run: npm ci
      - name: Check source and existing GitHub export
        working-directory: website
        run: |
          npm run check
          npm test
      - name: Build and verify own-domain website
        working-directory: website
        env:
          PARDUS_BASE: /
        run: |
          npm run build:domain
          npm run verify:export
      - name: Upload changed files with encrypted FTP
        env:
          FTP_SERVER: ${{ secrets.NAMECHEAP_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.NAMECHEAP_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.NAMECHEAP_FTP_PASSWORD }}
        run: python3 website/scripts/deploy-ftps.py
      - name: Verify the deployed release and legacy redirects
        working-directory: website
        run: node scripts/verify-live.mjs
      - name: Keep live verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pardus-live-verification
          path: website/live-verification.json
          if-no-files-found: ignore
