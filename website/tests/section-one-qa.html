<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Pardus section one responsive QA</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eeeae2;color:#11243a;font:14px Arial,sans-serif}header{min-height:56px;display:flex;align-items:center;flex-wrap:wrap;gap:8px 14px;padding:8px 16px;position:sticky;top:0;background:white;z-index:3}select,button{min-height:36px;font:inherit}main{padding:16px;width:max-content;min-width:100%}iframe{display:block;border:0;background:#f8f4ec;box-shadow:0 0 0 1px #bcc2c9}body.phone main{width:100%}body.phone iframe{margin-inline:auto}output{font-size:12px}
</style></head><body><header><strong>Homepage QA</strong><label>Viewport <select id="viewport"></select></label><label><input type="checkbox" id="large"> 200% text</label><button id="reload">Reload</button><button id="hero-view">Hero</button><button id="seam-view">Section transition</button><button id="escapes-view">Destinations</button><button id="services-view">Services</button><button id="fallback-view">Test text fallback</button><output id="status"></output></header>
<main><iframe title="Pardus responsive preview" id="preview" src="/"></iframe></main>
<script>
const sizes=[[320,568],[360,800],[375,812],[390,844],[414,896],[430,932],[600,960],[601,960],[767,1024],[768,1024],[820,1180],[999,900],[1000,768],[1024,768],[1199,900],[1200,900],[1280,800],[1440,900],[1536,864],[1920,1080],[2560,1440]];
const select=document.getElementById('viewport'), frame=document.getElementById('preview'), large=document.getElementById('large'), status=document.getElementById('status');
sizes.forEach(([w,h])=>select.add(new Option(w+' × '+h,w+'x'+h,w===1024,w===1024)));
function textScale(){const d=frame.contentDocument;if(!d)return;d.querySelectorAll('[data-qa-font]').forEach(e=>{e.style.fontSize='';delete e.dataset.qaFont});if(large.checked)d.querySelectorAll('.hero .eyebrow,.hero h1,.hero-text,.hero .btn,.site-header a,.menu-nav strong,.menu-nav small,.escapes-head .eyebrow,.escapes-head h2,.escapes-head .lead,.pick-label,.picker-q,.picker-group-title,.picker-group-text,.dest-duration,.scene-title h3,.promise h3,.promise p').forEach(e=>{const s=frame.contentWindow.getComputedStyle(e);const size=parseFloat(s.fontSize);e.dataset.qaFont=String(size);e.style.fontSize=size*2+'px'});status.textContent=select.value+' · '+(large.checked?'200% text':'100% zoom');}
function size(){const [w,h]=select.value.split('x').map(Number);frame.style.width=w+'px';frame.style.height=h+'px';frame.width=w;frame.height=h;document.body.classList.toggle('phone',w<=767);textScale();}
select.addEventListener('change',size);large.addEventListener('change',textScale);document.getElementById('reload').addEventListener('click',()=>frame.contentWindow.location.reload());frame.addEventListener('load',textScale);size();
document.getElementById('hero-view').addEventListener('click',()=>frame.contentWindow.scrollTo({top:0,behavior:'instant'}));
document.getElementById('seam-view').addEventListener('click',()=>{const h=frame.contentDocument.querySelector('.hero');frame.contentWindow.scrollTo({top:h.offsetHeight-220,behavior:'instant'})});
document.getElementById('escapes-view').addEventListener('click',()=>{const t=frame.contentDocument.querySelector('[data-escape-track]');frame.contentWindow.scrollTo({top:t.getBoundingClientRect().top+frame.contentWindow.scrollY-90,behavior:'instant'})});
document.getElementById('services-view').addEventListener('click',()=>{const t=frame.contentDocument.querySelector('[data-picker]');frame.contentWindow.scrollTo({top:t.getBoundingClientRect().top+frame.contentWindow.scrollY-95,behavior:'instant'})});
document.getElementById('fallback-view').addEventListener('click',()=>{const i=frame.contentDocument.querySelector('#hero-title [data-lettering-image]');i.srcset='';i.src='/__qa/missing-lettering.webp'});
</script></body></html>
