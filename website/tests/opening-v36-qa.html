<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Pardus opening and seamless section review</title><style>
*{box-sizing:border-box}body{margin:0;background:#ddd;color:#071d2b;font:14px system-ui}header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px;background:white}button,select{min-height:36px;font:inherit}main{width:max-content;padding:10px}iframe{display:block;border:0}pre{white-space:pre-wrap;max-width:100vw;padding:16px}body.presentation header,body.presentation pre{display:none}body.presentation main{padding:0}
</style></head><body><header><strong>Opening QA</strong><select id="size"></select><label><input type="checkbox" id="large">200% text</label><button id="section">View section</button><button id="opening">View opening</button><button id="join">View first join</button><button id="join2">View second join</button><button id="failed">Image failure</button><button id="heading-failed">Heading failure</button><button id="restore">Restore image</button><button id="noscript">No-script view</button><button id="matrix">Run responsive matrix</button><button id="present">Presentation</button><output id="status">Ready</output></header><main><iframe id="preview" title="Pardus website preview" src="/"></iframe></main><pre id="report"></pre><script>
const sizes=[[320,568],[360,800],[375,812],[390,844],[414,896],[430,932],[600,960],[601,960],[767,1024],[768,1024],[820,1180],[999,900],[1000,768],[1024,768],[1199,900],[1200,900],[1280,900],[1440,1024],[1536,1150],[1920,1200],[2560,1440]];
const frame=document.querySelector('iframe'),select=document.querySelector('#size'),large=document.querySelector('#large'),status=document.querySelector('#status'),report=document.querySelector('#report');
for(const [w,h] of sizes)select.add(new Option(`${w} × ${h}`,`${w}x${h}`,w===1536,w===1536));
select.add(new Option('390 × 1000 (full section)','390x1000'));
document.querySelector('#heading-failed').onclick=()=>{const im=frame.contentDocument.querySelector('#hero-title [data-lettering-image]');im.srcset='';im.src='/__qa/missing-lettering.webp';};
const tick=()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
async function waitFor(test,limit=12000){let start=performance.now();while(!test()){if(performance.now()-start>limit)throw Error('Timed out: '+test);await new Promise(r=>setTimeout(r,60))}}
async function ready(){await waitFor(()=>frame.contentDocument?.querySelector('[data-who-reference]'));const d=frame.contentDocument;await d.fonts.ready;d.querySelector('[data-skip-intro]')?.click();await waitFor(()=>!d.documentElement.classList.contains('intro-active'));frame.contentWindow.scrollTo({top:d.querySelector('#who-we-are').getBoundingClientRect().top+frame.contentWindow.scrollY-84,behavior:'instant'});await waitFor(()=>d.querySelector('[data-who-image]').complete&&d.querySelector('[data-who-image]').naturalWidth);await waitFor(()=>d.querySelector('[data-who-reference]').hasAttribute('data-who-ready'));await tick();}
async function setSize(){const [w,h]=select.value.split('x').map(Number);frame.width=w;frame.height=h;frame.style.width=w+'px';frame.style.height=h+'px';await tick();const d=frame.contentDocument;d.querySelectorAll('[data-qa-hero-font]').forEach(el=>{el.style.fontSize='';el.removeAttribute('data-qa-hero-font')});d.documentElement.style.fontSize=large.checked?'32px':'';if(large.checked)d.querySelectorAll('.hero h1,.hero-text,.hero .btn,.hero .eyebrow').forEach(el=>{const size=parseFloat(frame.contentWindow.getComputedStyle(el).fontSize);el.setAttribute('data-qa-hero-font','');el.style.fontSize=size*2+'px'});await tick();await ready();status.textContent=select.value+' / '+(large.checked?'200% text':'100% zoom');}
select.onchange=setSize;large.onchange=setSize;frame.onload=setSize;document.querySelector('#section').onclick=()=>{const d=frame.contentDocument;frame.contentWindow.scrollTo({top:d.querySelector('#who-we-are').getBoundingClientRect().top+frame.contentWindow.scrollY-84,behavior:'instant'})};
document.querySelector('#failed').onclick=async()=>{let img=frame.contentDocument.querySelector('[data-who-image]');img.closest('picture').querySelectorAll('source').forEach(s=>s.removeAttribute('srcset'));img.removeAttribute('srcset');img.src='/__qa/missing-who.webp';await waitFor(()=>!frame.contentDocument.querySelector('[data-who-reference]').hasAttribute('data-who-ready'));status.textContent='Image failed: native text/action fallback';};
document.querySelector('#restore').onclick=()=>{frame.removeAttribute('sandbox');frame.onload=setSize;frame.contentWindow.location.reload()};document.querySelector('#noscript').onclick=()=>{frame.onload=()=>{const d=frame.contentDocument;d.querySelector('#who-we-are').scrollIntoView({behavior:'instant'});status.textContent='No-script: native heading, paragraph and action';};frame.setAttribute('sandbox','allow-same-origin');frame.src='/?qa=no-script';};
document.querySelector('#opening').onclick=()=>frame.contentWindow.scrollTo({top:0,behavior:'instant'});document.querySelector('#join').onclick=()=>{const d=frame.contentDocument;frame.contentWindow.scrollTo({top:d.querySelector('.hero').offsetHeight-220,behavior:'instant'})};document.querySelector('#join2').onclick=()=>{const s=frame.contentDocument.querySelector('#who-we-are');frame.contentWindow.scrollTo({top:s.offsetTop+s.offsetHeight-240,behavior:'instant'})};document.querySelector('#present').onclick=()=>document.body.classList.toggle('presentation');
document.querySelector('#matrix').onclick=async()=>{const rows=[];report.textContent='Running';try{for(const [w,h] of sizes){for(const enlarged of [false,true]){select.value=w+'x'+h;large.checked=enlarged;await setSize();const d=frame.contentDocument,s=d.querySelector('[data-who-reference]'),im=d.querySelector('[data-who-image]'),a=s.querySelector('a'),r=s.getBoundingClientRect(),ir=im.getBoundingClientRect(),ar=a.getBoundingClientRect();const layoutWidth=d.documentElement.clientWidth;const expected=w<=999?853/1844:1536/1024;const failures=[];if(d.documentElement.scrollWidth>layoutWidth+1)failures.push('horizontal overflow: '+JSON.stringify([...d.querySelectorAll('body *')].filter(el=>{const er=el.getBoundingClientRect();return er.width>0&&er.right>layoutWidth+1&&getComputedStyle(el).position!=='absolute'&&getComputedStyle(el).position!=='fixed'}).slice(0,10).map(el=>({tag:el.tagName,cls:el.getAttribute('class'),right:Math.round(el.getBoundingClientRect().right),text:el.textContent.trim().slice(0,40)}))));if(Math.abs(r.width-layoutWidth)>1)failures.push('section width');if(ar.width<44||ar.height<43.99)failures.push('tap target');if(ar.left<r.left-1||ar.right>r.right+1)failures.push('action outside section');if(enlarged&&!s.hasAttribute('data-who-flow'))failures.push('text reflow not active');if(!enlarged&&Math.abs(ir.width/ir.height-expected)>.001)failures.push('art distortion');if(!enlarged&&!im.currentSrc.includes(w<=999?'mobile':'desktop'))failures.push('wrong art direction');if(enlarged){for(const el of s.querySelectorAll('h2,p,a,li')){const er=el.getBoundingClientRect();if(er.right>r.right+1||er.left<r.left-1||el.scrollWidth>el.clientWidth+2)failures.push('text overflow: '+el.tagName)}}const hero=d.querySelector('.hero'),hr=hero.getBoundingClientRect(),hc=hero.querySelector('[data-hero-copy]').getBoundingClientRect();if(hc.bottom>hr.bottom+1)failures.push('hero copy clipped');const boxes=[...hero.querySelectorAll('[data-leopard-box]')].map(e=>e.getBoundingClientRect());const content=[...hero.querySelectorAll('h1,.hero-text,.actions')].map(e=>e.getBoundingClientRect());if(content.some(c=>boxes.some(b=>c.left<b.right+8&&c.right>b.left-8&&c.top<b.bottom+8&&c.bottom>b.top-8)))failures.push('hero copy touches leopard');for(const btn of hero.querySelectorAll('.actions a')){const br=btn.getBoundingClientRect();if(br.width<44||br.height<44||br.left<0||br.right>layoutWidth+1)failures.push('hero action target')};if(!enlarged&&!hero.querySelector('[data-lettering-image]').currentSrc.includes('pardus-v36-'))failures.push('old hero lettering');rows.push({width:w,height:h,text:enlarged?'200%':'100%',art:im.currentSrc.split('/').pop(),sectionHeight:Math.round(r.height),cta:[Math.round(ar.width),Math.round(ar.height)],failures});status.textContent=rows.length+' cases';}}report.textContent=JSON.stringify({passed:rows.filter(r=>!r.failures.length).length,total:rows.length,rows},null,2);status.textContent=rows.every(r=>!r.failures.length)?'PASS: '+rows.length+' cases':'FAIL';}catch(e){report.textContent=JSON.stringify({error:String(e),rows},null,2);status.textContent='ERROR';}};
setSize();
</script></body></html>
